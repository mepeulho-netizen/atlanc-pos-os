/* ---------- 뷰 이벤트 ---------- */
function bindView(host) {
  host.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => { S.view = el.getAttribute("data-goto"); saveState(); render(); });
  host.querySelectorAll("[data-branch]").forEach(el => el.onclick = () => {
    if (S.sessionRole !== "hq") return;
    S.role = el.getAttribute("data-branch");
    const sel = document.getElementById("branchSelect");
    if (sel) sel.value = S.role;
    document.getElementById("sideBranchName").textContent = branchName(S.role);
    document.getElementById("sideWho").textContent = roleLabel();
    saveState(); render();
  });
  host.querySelectorAll("[data-month]").forEach(el => el.onclick = () => { S.month = el.getAttribute("data-month"); saveState(); render(); });
  host.querySelectorAll("[data-dz-period]").forEach(el => el.onclick = () => { window.__dzPeriod = el.getAttribute("data-dz-period"); render(); });
  host.querySelectorAll("[data-check-branch]").forEach(el => el.onclick = () => {
    window.__checkBranch = el.getAttribute("data-check-branch");
    render();
  });

  // 손익 입력
  host.querySelectorAll("[data-pl]").forEach(el => {
    el.onchange = () => {
      const bid = curBranch();
      if (bid === "hq") return;
      const key = el.getAttribute("data-pl");
      S.pl[bid] = S.pl[bid] || {};
      if (key === "basis") S.pl[bid].basis = el.value;
      else S.pl[bid][key] = Math.max(0, Number(String(el.value).replace(/[^0-9.]/g, "")) || 0);
      saveState();
      render();
      const again = document.querySelector('[data-pl="' + key + '"]');
      if (again) again.focus();
    };
  });
  const fill = host.querySelector("#fillAssumptions");
  if (fill) fill.onclick = () => {
    const bid = curBranch();
    const m = metricsOf(bid, S.month);
    if (!m) return;
    const base = S.pl[bid] || {};
    S.pl[bid] = Object.assign({}, base, {
      rent: Math.round(m.rev * 0.09 / 10000) * 10000,
      laborFixed: Math.round(m.rev * 0.27 / 10000) * 10000,
      laborVarPct: 3,
      materialPct: 8,
      cardFeePct: base.cardFeePct || 2.5,
      otherFixed: Math.round(m.rev * 0.055 / 10000) * 10000,
      royaltyPct: 5, sharePct: 20, interest: 0, taxPct: 9
    });
    saveState(); render();
    toast("가정값을 채웠습니다. 실제 값으로 바꿔 주세요.");
  };

  // 체크리스트
  host.querySelectorAll("[data-chk-toggle]").forEach(el => {
    el.onchange = () => {
      const bid = S.role === "hq" ? (window.__checkBranch || BRANCHES[0].id) : S.role;
      S.checklist[bid] = S.checklist[bid] || { items: {} };
      const id = el.getAttribute("data-chk-toggle");
      S.checklist[bid].items[id] = S.checklist[bid].items[id] || { done: false, note: "" };
      S.checklist[bid].items[id].done = el.checked;
      S.checklist[bid].updatedAt = Date.now();
      saveState(); render();
    };
  });
  let noteTimer = null;
  host.querySelectorAll("[data-chk-note]").forEach(el => {
    el.oninput = () => {
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => {
        const bid = S.role === "hq" ? (window.__checkBranch || BRANCHES[0].id) : S.role;
        S.checklist[bid] = S.checklist[bid] || { items: {} };
        const id = el.getAttribute("data-chk-note");
        S.checklist[bid].items[id] = S.checklist[bid].items[id] || { done: false, note: "" };
        S.checklist[bid].items[id].note = el.value;
        saveState();
      }, 400);
    };
  });

  // 데이터 탭
  const dz = host.querySelector("#dropzone");
  const input = host.querySelector("#fileInput");
  const pick = host.querySelector("#pickFile");
  if (pick && input) pick.onclick = () => input.click();
  if (input) input.onchange = () => { if (input.files.length) handleFiles(Array.from(input.files)); };
  if (dz && input) {
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => {
      e.preventDefault(); dz.classList.remove("over");
      const files = Array.from(e.dataTransfer.files || []);
      if (files.length) handleFiles(files);
    };
  }
  const tmpl = host.querySelector("#downloadTemplate");
  if (tmpl) tmpl.onclick = () => {
    const blob = new Blob([buildTemplateCSV()], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ATLANC_핸드SOS_매출상세_양식.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast("샘플 양식 CSV를 내려받았습니다.");
  };
  host.querySelectorAll("[data-del-file]").forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute("data-del-file");
      confirmModal("파일 삭제", "이 파일의 거래 자료가 대시보드에서 빠집니다. 되돌릴 수 없습니다.", "삭제", () => {
        S.data.files = S.data.files.filter(f => f.id !== id);
        if (!S.data.files.length) S.data.source = "sample";
        S.data.updatedAt = Date.now();
        buildStats(); saveState(); render();
      }, true);
    };
  });
  const reload = host.querySelector("#reloadSample");
  if (reload) reload.onclick = () => confirmModal("샘플로 되돌리기", "업로드한 자료가 모두 지워집니다.", "되돌리기", () => {
    S.data = { source: "sample", files: [], updatedAt: Date.now() };
    buildStats(); saveState(); render();
  }, true);
  const exp = host.querySelector("#exportBackup");
  if (exp) exp.onclick = exportBackup;
  const imp = host.querySelector("#importBackup");
  const binput = host.querySelector("#backupInput");
  if (imp && binput) {
    imp.onclick = () => binput.click();
    binput.onchange = () => { if (binput.files[0]) importBackup(binput.files[0]); };
  }
  const saveApi = host.querySelector("#saveApi");
  if (saveApi) saveApi.onclick = () => {
    S.settings.apiUrl = host.querySelector("#apiUrl").value.trim();
    saveState(); toast("저장했습니다.");
  };
  const testApi = host.querySelector("#testApi");
  if (testApi) testApi.onclick = async () => {
    const url = host.querySelector("#apiUrl").value.trim();
    const res = host.querySelector("#apiResult");
    if (!url) { res.textContent = "URL을 먼저 입력하세요."; return; }
    res.textContent = "확인 중…";
    try {
      const r = await fetch(url, { method: "GET", redirect: "follow" });
      const text = await r.text();
      let parsed = null;
      try { parsed = JSON.parse(text); } catch (e) { }
      res.innerHTML = 'HTTP ' + r.status + (parsed ? ' · JSON 응답 확인(' + (Array.isArray(parsed) ? parsed.length + "행" : Object.keys(parsed).slice(0, 5).join(", ")) + ")" : " · JSON이 아닌 응답입니다(Apps Script 배포 권한 확인)");
    } catch (e) {
      res.textContent = "연결 실패: " + e.message + " · Apps Script는 '모든 사용자' 액세스로 배포해야 합니다.";
    }
  };

  // 설정
  host.querySelectorAll("[data-open]").forEach(el => {
    el.onchange = () => {
      S.settings.branches = S.settings.branches || {};
      const id = el.getAttribute("data-open");
      S.settings.branches[id] = S.settings.branches[id] || {};
      S.settings.branches[id].open = el.value;
      saveState(); toast(branchName(id) + " 오픈일 저장");
    };
  });
  host.querySelectorAll("[data-pin]").forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute("data-pin");
      if (S.settings.pins && S.settings.pins[id]) {
        confirmModal("잠금 해제", branchName(id) + "의 PIN을 지웁니다.", "해제", () => {
          delete S.settings.pins[id]; saveState(); render();
        }, true);
      } else {
        setPin(id);
      }
    };
  });
  const reset = host.querySelector("#resetAll");
  if (reset) reset.onclick = () => confirmModal("모든 데이터 초기화", "업로드 자료·손익 입력·체크리스트·PIN이 모두 지워집니다.", "초기화", () => {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }, true);
}

function setPin(bid) {
  openModal("<h3>" + branchName(bid) + " PIN 설정</h3><p>숫자 4~6자리. 잊으면 이 화면에서 해제할 수 없어 브라우저 저장을 지워야 합니다.</p>" +
    '<input id="pinNew" type="password" inputmode="numeric" maxlength="8" placeholder="새 PIN">' +
    '<div class="row"><button class="btn ghost wide" data-x="cancel">취소</button><button class="btn primary wide" data-x="ok">저장</button></div>',
    host => {
      const input = host.querySelector("#pinNew");
      host.querySelector('[data-x="cancel"]').onclick = closeModal;
      host.querySelector('[data-x="ok"]').onclick = () => {
        if (!/^\d{4,6}$/.test(input.value)) { input.value = ""; input.placeholder = "4~6자리 숫자"; return; }
        S.settings.pins = S.settings.pins || {};
        S.settings.pins[bid] = hashPin(input.value);
        saveState(); closeModal(); render(); toast("PIN을 설정했습니다.");
      };
    });
}

/* ---------- 업로드 ---------- */
async function handleFiles(files) {
  const fallback = document.getElementById("uploadBranch") ? document.getElementById("uploadBranch").value : "";
  const results = [];
  toast(files.length + "개 파일 확인 중…");
  for (const file of files) {
    try {
      const branchGuess = findBranchFromName(file.name) || fallback || "";
      const parsed = await parseFile(file, branchGuess);
      if (!branchGuess && parsed.rows.some(r => !r.b)) {
        const suggestions = Array.from(new Set(parsed.rows.map(r => r.b).filter(Boolean)));
        throw new Error("지점을 알 수 없습니다. 위의 '지점 자동 인식이 안 될 때'에서 지점을 고르고 다시 올려 주세요." + (suggestions.length ? " (파일 안 지점: " + suggestions.join(", ") + ")" : ""));
      }
      const rows = parsed.rows;
      // 파일 안에 지점 열이 있으면 그 값 사용
      const branches = Array.from(new Set(rows.map(r => r.b)));
      const branch = branchGuess || (branches.length === 1 ? branches[0] : "geondae");
      if (!rows.length) throw new Error("거래 행이 없습니다.");
      rows.forEach(r => { r.b = branchGuess && branches.length > 1 ? r.b : branch; });
      const from = rows.reduce((a, r) => (r.d < a ? r.d : a), rows[0].d);
      const to = rows.reduce((a, r) => (r.d > a ? r.d : a), rows[0].d);
      const rev = rows.reduce((a, r) => a + (r.cash + r.card + r.bank + r.pay + r.etc + r.credit), 0);
      results.push({
        ok: true, name: file.name, branch, from, to, count: rows.length, rev,
        skipped: parsed.skipped, rows
      });
    } catch (e) {
      results.push({ ok: false, name: file.name, error: e.message });
    }
  }
  const good = results.filter(r => r.ok);
  const bad = results.filter(r => !r.ok);
  if (!good.length) {
    toast("업로드 실패: " + (bad[0] ? bad[0].error : "알 수 없는 오류"), true);
    showUploadReport(results);
    return;
  }
  const apply = () => {
    const dupKey = f => f.name + "|" + f.count + "|" + f.from + "|" + f.to;
    const existing = new Set(S.data.files.map(dupKey));
    let added = 0, skippedDup = 0;
    good.forEach(g => {
      const rec = { id: uid(), name: g.name, branch: g.branch, from: g.from, to: g.to, count: g.count, rev: g.rev, skipped: g.skipped, rows: g.rows, at: Date.now() };
      if (existing.has(dupKey(rec))) { skippedDup++; return; }
      S.data.files.push(rec); existing.add(dupKey(rec)); added++;
    });
    S.data.source = "upload";
    S.data.updatedAt = Date.now();
    buildStats(); saveState();
    if (S.stats.months.length) S.month = S.stats.months[S.stats.months.length - 1];
    render();
    toast(added + "개 파일 반영" + (skippedDup ? " · 중복 " + skippedDup + "건 제외" : "") + (bad.length ? " · 실패 " + bad.length + "건" : ""), !added);
    if (bad.length) showUploadReport(results);
  };
  if (S.data.source === "sample") {
    confirmModal("실제 자료로 전환",
      "샘플 데이터를 지우고 방금 올린 <b>" + good.length + "개 파일</b>로 시작합니다.<br><br>" +
      good.map(g => "· " + esc(g.name) + " → " + branchName(g.branch) + " · " + nfmt(g.count) + "행").join("<br>"),
      "전환하기", apply);
  } else {
    apply();
  }
}

function showUploadReport(results) {
  const bad = results.filter(r => !r.ok);
  if (!bad.length) return;
  openModal("<h3>읽지 못한 파일</h3><p>아래 이유를 확인하고 다시 올려 주세요.</p>" +
    '<div style="max-height:340px;overflow:auto;font-size:.95rem;line-height:1.7">' +
    bad.map(b => "· <b>" + esc(b.name) + "</b><br><span class='muted'>" + esc(b.error) + "</span>").join("<br><br>") +
    '</div><div class="row"><button class="btn primary wide" data-x="ok">확인</button></div>',
    host => { host.querySelector('[data-x="ok"]').onclick = closeModal; });
}

/* ---------- 백업 ---------- */
function exportBackup() {
  const payload = {
    version: APP_VERSION, exportedAt: new Date().toISOString(),
    data: { source: S.data.source, files: S.data.files },
    pl: S.pl, checklist: S.checklist, settings: S.settings
  };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ATLANC_POS_백업_" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("백업 파일을 내려받았습니다.");
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const p = JSON.parse(reader.result);
      if (!p.data && !p.pl) throw new Error("형식이 맞지 않습니다.");
      confirmModal("백업 가져오기", "현재 자료를 덮어씁니다.", "가져오기", () => {
        S.data = { source: p.data && p.data.source === "upload" ? "upload" : "sample", files: (p.data && p.data.files) || [], updatedAt: Date.now() };
        S.pl = p.pl || {}; S.checklist = p.checklist || {}; S.settings = Object.assign(S.settings, p.settings || {});
        buildStats(); saveState(); render(); toast("가져왔습니다.");
      }, true);
    } catch (e) { toast("가져오기 실패: " + e.message, true); }
  };
  reader.readAsText(file);
}

/* ---------- 부트 ---------- */
function loadSheetJS() {
  const s = document.createElement("script");
  s.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
  s.async = true;
  s.onerror = () => { window.__xlsxFailed = true; };
  document.head.appendChild(s);
}

function boot() {
  loadState();
  loadSheetJS();
  renderLogin();
  document.getElementById("loginSampleBtn").onclick = () => {
    if (S.data.source !== "sample") {
      confirmModal("샘플로 보기", "샘플로 전환하면 업로드 자료가 화면에서 빠집니다(삭제는 '데이터' 탭에서).", "샘플로 보기", () => {
        S.data = { source: "sample", files: S.data.files, updatedAt: Date.now() };
        S.stats = null; renderLogin(); enterApp("hq");
      });
    } else enterApp("hq");
  };
  document.getElementById("logoutBtn").onclick = logout;
  document.getElementById("branchSelect").onchange = e => {
    if (S.sessionRole !== "hq") return;
    S.role = e.target.value;
    document.getElementById("sideBranchName").textContent = branchName(S.role);
    document.getElementById("sideWho").textContent = roleLabel();
    saveState(); render();
  };
  document.querySelectorAll(".nav-item").forEach(b => {
    b.onclick = () => { S.view = b.getAttribute("data-view"); saveState(); render(); };
  });
  document.getElementById("prevMonth").onclick = () => { S.month = addMonths(S.month, -1); saveState(); render(); };
  document.getElementById("nextMonth").onclick = () => { S.month = addMonths(S.month, 1); saveState(); render(); };
  const pr = document.getElementById("printBtn");
  if (pr) pr.onclick = () => window.print();
  // 문서 전체 단축키
  window.addEventListener("keydown", e => {
    if (!S.role) return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") { document.getElementById("prevMonth").click(); }
    if (e.key === "ArrowRight") { document.getElementById("nextMonth").click(); }
  });
}
boot();
